name: Publish CLI

on: workflow_dispatch

# Windows binaries are Authenticode-signed with Azure Artifact Signing. The
# sign tool authenticates with the "fluxzy-ci-signing" app registration
# through a client secret read from the environment (AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_CLIENT_SECRET): no Azure CLI, no azure/login, no
# certificate file on the runner. The app must hold "Artifact Signing
# Certificate Profile Signer" on the fluxzy-public profile
# (build/setup-artifact-signing.cmd). Linux/ARM64 artifacts are not signed.
jobs:
  publish-release:
    name: "Publish release"
    strategy:
      matrix:
        osversion: [Linux, Windows, ARM64]
        ostype: ['self-hosted']
      fail-fast: false

    runs-on: ${{ matrix.osversion }}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Validate signing secrets
      if: runner.os == 'Windows'
      shell: bash
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        missing=""
        [ -z "$AZURE_CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID"
        [ -z "$AZURE_TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
        [ -z "$AZURE_CLIENT_SECRET" ] && missing="$missing AZURE_CLIENT_SECRET"

        if [ -n "$missing" ]; then
          echo "::error::Missing required secrets:$missing"
          exit 1
        fi

    - name: Publish CLI
      shell: bash
      env:
        TOKEN_FOR_NUGET : ${{ secrets.TOKEN_FOR_NUGET }}
        GH_RELEASE_TOKEN : ${{ secrets.GH_RELEASE_TOKEN }}
        REPOSITORY_OWNER : ${{ github.repository_owner }}
        REPOSITORY_NAME : ${{ github.event.repository.name }}

        PARTNER_SECRET : ${{ secrets.PARTNER_SECRET }}

        UPLOAD_RELEASE_TOKEN : ${{ secrets.UPLOAD_RELEASE_TOKEN }}

        # Azure Artifact Signing (EnvironmentCredential)
        AZURE_CLIENT_ID : ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID : ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_SECRET : ${{ secrets.AZURE_CLIENT_SECRET }}

      run: bash build.sh fluxzy-cli-publish-with-note
