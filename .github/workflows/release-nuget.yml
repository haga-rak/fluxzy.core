name: Publish NuGet (PRIVATE!)

on: workflow_dispatch

# Packages pushed to the private feeds are author-signed with Azure Artifact
# Signing (client secret of the "fluxzy-ci-signing" app registration, see
# release-cli.yml). Private feeds accept any author certificate, unlike
# nuget.org, hence NUGET_PACKAGE_SIGN=1 here only.
jobs:
  publish-release:
    name: "Publish release"
    strategy:
      matrix:
        osversion: [Windows]
        ostype: ['self-hosted']
      fail-fast: false

    runs-on: ${{ matrix.osversion }}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Validate signing secrets
      shell: bash
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        missing=""
        [ -z "$AZURE_CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID"
        [ -z "$AZURE_TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
        [ -z "$AZURE_CLIENT_SECRET" ] && missing="$missing AZURE_CLIENT_SECRET"

        if [ -n "$missing" ]; then
          echo "::error::Missing required secrets:$missing"
          exit 1
        fi

    - name: Publish to private Nugets
      shell: bash
      env:
        TOKEN_FOR_NUGET : ${{ secrets.TOKEN_FOR_NUGET }}
        PARTNER_SECRET : ${{ secrets.PARTNER_SECRET }}

        NUGET_PACKAGE_SIGN : 1
        AZURE_CLIENT_ID : ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID : ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_SECRET : ${{ secrets.AZURE_CLIENT_SECRET }}

      run: bash build.sh fluxzy-publish-nuget
